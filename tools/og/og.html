<!doctype html>
<!-- Imagen para compartir el enlace (1200×630). Se regenera con: node tools/og/generar.js -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../../fonts/bricolage-grotesque-800.woff2") format("woff2");font-weight:800}
@font-face{font-family:Inter;src:url("../../fonts/inter-400.woff2") format("woff2");font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:#F2F0ED;
  background:radial-gradient(520px 420px at 82% 45%,rgba(240,74,45,.38),transparent 70%),#0E0D0C}
.izq{position:absolute;left:72px;top:92px;width:640px}
.izq img{height:46px}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:70px;text-wrap:balance;line-height:.96;letter-spacing:-.035em;margin-top:56px}
h1 em{font-style:normal;color:#F04A2D;white-space:nowrap}
p{font-size:25px;color:#C9C3BC;margin-top:26px;line-height:1.35}
.sticker{position:absolute;left:76px;top:478px;background:#F6B92B;color:#111;font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;text-transform:uppercase;padding:12px 18px 10px;border-radius:9px;transform:rotate(-4deg);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.tel{position:absolute;width:236px;background:#0B0A09;border-radius:34px;padding:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 30px 60px rgba(0,0,0,.6),0 0 90px -10px rgba(240,74,45,.6)}
.tel::before{content:"";position:absolute;z-index:2;top:16px;left:50%;width:56px;height:14px;transform:translateX(-50%);border-radius:9px;background:#000}
.tel img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:27px}
.t1{left:760px;top:92px;transform:rotate(-7deg)}
.t2{left:935px;top:60px;transform:rotate(6deg)}
</style></head><body>
<div class="izq">
  <img src="../../img/brand/pulseads-horizontal-color-oscuro.svg" alt="">
  <h1>Vídeos que hacen que tu local <em>se note.</em></h1>
  <p>Anuncios cortos con IA para bares, restaurantes, barberías y comercios de barrio.</p>
</div>
<span class="sticker">Demo gratis · 10 s</span>
<div class="tel t1"><img src="../../img/videos/barberia-navaja.webp" alt=""></div>
<div class="tel t2"><img src="../../img/videos/hamburgueseria-brasa21.webp" alt=""></div>
</body></html>
